<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&amp;family=Inter:wght@600&amp;display=swap');
      .emblem-kanji {
        font-family: 'Noto Serif JP', 'MingLiU', 'SimSun', 'Microsoft YaHei', serif;
        font-size: 26px;
        font-weight: 700;
        fill: url(#goldGrad);
        letter-spacing: 2px;
      }
      .emblem-sub {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #F4F0E8;
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD098" />
      <stop offset="50%" stop-color="#D6A85F" />
      <stop offset="100%" stop-color="#B38032" />
    </linearGradient>
    <radialGradient id="yoruRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191920" />
      <stop offset="100%" stop-color="#0E0E12" />
    </radialGradient>
  </defs>

  <!-- Background Kage Black -->
  <rect width="192" height="192" fill="#0B0B0D" rx="24" />

  <!-- Outer Subtle Square -->
  <rect x="8" y="8" width="176" height="176" rx="18" fill="none" stroke="#292930" stroke-width="1.2" />

  <!-- Inner Circle Emblem -->
  <circle cx="96" cy="96" r="78" fill="url(#yoruRadial)" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="96" cy="96" r="73" fill="none" stroke="#D6A85F" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Kanji: 提摩太 -->
  <text x="96" y="88" text-anchor="middle" dominant-baseline="central" class="emblem-kanji">提摩太</text>

  <!-- Torii Red Diamond Accent -->
  <polygon points="96,118 100,123 96,128 92,123" fill="#C62828" />

  <!-- Subtitle THEO -->
  <text x="98" y="145" text-anchor="middle" class="emblem-sub">THEO</text>
</svg>
